<h1>プライバシーポリシー</h1>
<p>truenas-drive は、作成者本人が、自分のGoogleドライブを、自宅のNASと同期するためだけに使う個人用ツールです。</p>
<h2>取得するデータ</h2>
<p>同期のために、作成者本人のGoogleドライブのファイルとメタデータにアクセスします。</p>
<h2>データの利用と保存</h2>
<p>取得したデータは、同期の目的にのみ利用し、作成者本人のNAS内にのみ保存します。</p>
<h2>第三者への提供</h2>
<p>データを、第三者に提供、販売、公開することはありません。</p>
<h2>データの削除</h2>
<p>Googleアカウントの設定から、このアプリへのアクセス権を、いつでも取り消せます。</p>
